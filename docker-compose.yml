# Môi trường chạy đầy đủ: MySQL + Redis + migrate + app.
#   docker compose up --build            # dựng image, migrate, chạy app
#   docker compose up -d mysql redis     # chỉ hạ tầng, để chạy `npm run dev` trên máy
# Biến ${...} lấy từ file .env cạnh file này nếu có, không thì dùng mặc định bên dưới (chỉ cho dev).

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: mysql://${MYSQL_USER:-ews}:${MYSQL_PASSWORD:-ews}@mysql:3306/${MYSQL_DATABASE:-ews_astrolink}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  # Chưa được đọc — shared/streams (lượt 2) sẽ khai biến này trong shared/config.
  REDIS_URL: redis://redis:6379

# Cùng một image cho mọi process; `pull_policy: build` để compose dựng tại chỗ thay vì đi pull
# một image không có trên registry.
x-app-image: &app-image
  build: .
  image: ews-astrolink-api:local
  pull_policy: build

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # UTC ở mọi tầng (ADR-0002); client vẫn tự SET time_zone cho từng connection.
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ews_astrolink}
      MYSQL_USER: ${MYSQL_USER:-ews}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ews}
    ports:
      - ${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Ping qua TCP 127.0.0.1, không qua socket: lúc khởi tạo lần đầu image chạy một server tạm
      # chỉ nghe socket — ping socket sẽ báo "healthy" quá sớm.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    # AOF: Redis Streams là hàng đợi, mất dữ liệu khi restart sẽ phải relay lại từ outbox.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-image
    command: ['node', 'dist/src/entrypoints/migrate.js']
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  app:
    <<: *app-image
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Hiện chỉ kiểm kết nối DB rồi thoát. Lượt 3 tách thành api / worker / scheduler chạy lâu dài
    # (cùng image, khác command) và đổi sang restart: unless-stopped.
    restart: 'no'

volumes:
  mysql-data:
  redis-data:
