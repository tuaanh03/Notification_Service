# Môi trường chạy đầy đủ: MySQL + Redis + migrate + api + worker + scheduler.
#   docker compose up --build            # dựng image, migrate, chạy 3 process
#   docker compose up -d --scale worker=3   # thêm worker khi hàng đợi dồn
#   docker compose up -d mysql redis     # chỉ hạ tầng, để chạy `npm run dev` trên máy
# Biến ${...} lấy từ file .env cạnh file này nếu có, không thì dùng mặc định bên dưới (chỉ cho dev).

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: mysql://${MYSQL_USER:-ews}:${MYSQL_PASSWORD:-ews}@mysql:3306/${MYSQL_DATABASE:-ews_astrolink}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  REDIS_URL: redis://redis:6379

# Cùng một image cho mọi process; `pull_policy: build` để compose dựng tại chỗ thay vì đi pull
# một image không có trên registry.
x-app-image: &app-image
  build: .
  image: ews-astrolink-api:local
  pull_policy: build

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # UTC ở mọi tầng (ADR-0002); client vẫn tự SET time_zone cho từng connection.
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ews_astrolink}
      MYSQL_USER: ${MYSQL_USER:-ews}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ews}
    ports:
      - ${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Ping qua TCP 127.0.0.1, không qua socket: lúc khởi tạo lần đầu image chạy một server tạm
      # chỉ nghe socket — ping socket sẽ báo "healthy" quá sớm.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    # AOF: Redis Streams là hàng đợi, mất dữ liệu khi restart sẽ phải relay lại từ outbox.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-image
    command: ['node', 'dist/src/entrypoints/migrate.js']
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'

  # Ba process chạy lâu dài, CÙNG một image, khác command (tài liệu kiến trúc §2).
  api:
    <<: *app-image
    command: ['node', 'dist/src/entrypoints/api.js']
    environment:
      <<: *app-env
      PORT: 3000
    ports:
      # Cổng phía host theo tài liệu kiến trúc §2 (4002); trong container vẫn là 3000.
      - ${API_PORT:-4002}:3000
    depends_on: &after-migrate
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Image slim không có curl — dùng chính node để gọi readiness.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    <<: *app-image
    command: ['node', 'dist/src/entrypoints/worker.js']
    environment:
      <<: *app-env
      # Scale riêng phần gửi mail: thêm một service worker khác với WORKER_GROUPS=delivery-email.
      WORKER_GROUPS: ${WORKER_GROUPS:-all}
    depends_on: *after-migrate
    stop_grace_period: 15s
    restart: unless-stopped

  scheduler:
    <<: *app-image
    command: ['node', 'dist/src/entrypoints/scheduler.js']
    environment: *app-env
    depends_on: *after-migrate
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
